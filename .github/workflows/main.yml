name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (格式 v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: android
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: dragonfly
            goarch: amd64
          - goos: freebsd
            goarch: 386
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm
          - goos: freebsd
            goarch: arm64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: s390x
          - goos: netbsd
            goarch: 386
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm
          - goos: netbsd
            goarch: arm64
          - goos: openbsd
            goarch: 386
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm
          - goos: openbsd
            goarch: arm64
          - goos: plan9
            goarch: 386
          - goos: plan9
            goarch: amd64
          - goos: solaris
            goarch: amd64
          - goos: windows
            goarch: 386
            ext: ".exe"
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"

    outputs:
      build_time: ${{ steps.set-build-time.outputs.BUILD_TIME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache: true

      # 调试：查看文件内容
      - name: Debug - List files
        run: |
          echo "当前目录文件列表:"
          ls -la
          echo ""
          echo "go.mod 内容:"
          cat go.mod || echo "go.mod 不存在"
          echo ""
          echo "iptest.go 导入语句:"
          grep -n "github.com" iptest.go || echo "未找到导入"

      # 下载依赖
      - name: Download dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy

      # 下载 GeoIP 数据库
      - name: Download GeoLite2 Database
        run: |
          echo "正在下载 GeoLite2-City.mmdb..."
          wget -O GeoLite2-City.mmdb https://git.io/GeoLite2-City.mmdb || \
          wget -O GeoLite2-City.mmdb https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-City.mmdb || \
          wget -O GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb
          
          if [ -f "GeoLite2-City.mmdb" ]; then
            echo "GeoIP数据库下载成功，文件大小: $(ls -lh GeoLite2-City.mmdb | awk '{print $5}')"
          else
            echo "警告: GeoIP数据库下载失败，将只使用Cloudflare数据中心信息"
            touch GeoLite2-City.mmdb
          fi

      - name: Create Release Assets Directory
        run: mkdir -p "${{ github.workspace }}/release_assets"

      - name: Set Build Time
        id: set-build-time
        run: |
          build_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "BUILD_TIME=$build_time" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          echo "Building iptest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}..."
          
          export CGO_ENABLED=0
          
          if [ "${{ matrix.goos }}" = "linux" ] && [[ "${{ matrix.goarch }}" == "arm"* ]]; then
            export GOARM=7
            go build -a -ldflags="-s -w -extldflags=-static" -o ${{ github.workspace }}/release_assets/iptest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }} iptest.go
          else
            go build -ldflags="-s -w" -o ${{ github.workspace }}/release_assets/iptest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }} iptest.go
          fi
          
          if [ -f "${{ github.workspace }}/release_assets/iptest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}" ]; then
            echo "构建成功"
          else
            echo "构建失败"
            exit 1
          fi
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.goos }}

      - name: Copy resource files
        run: |
          if [ -f "locations.json" ]; then
            cp locations.json ${{ github.workspace }}/release_assets/
            echo "已复制 locations.json"
          fi
          
          if [ -f "GeoLite2-City.mmdb" ] && [ -s "GeoLite2-City.mmdb" ]; then
            cp GeoLite2-City.mmdb ${{ github.workspace }}/release_assets/
            echo "已复制 GeoLite2-City.mmdb"
          fi

      - name: Generate SHA256
        run: |
          cd "${{ github.workspace }}/release_assets"
          for file in $(find . -type f ! -name '*.sha256'); do
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
          done
          echo "SHA256 files generated:"
          ls -1 *.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptest-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext || '' }}
          path: ${{ github.workspace }}/release_assets/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f ! -name "*.txt" -exec mv {} release_assets/ \;
          echo "Files to release:"
          ls -lh release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Release ${{ github.event.inputs.release_tag || github.ref_name }}"
          body: |
            ## 多平台构建版本
            **构建时间:** ${{ needs.build.outputs.build_time }}

            ## 新功能
            - ✅ 集成 GeoIP2 离线数据库，支持精确的 IP 地理位置定位
            - ✅ 支持中国境内城市准确识别
            - ✅ 内置 GeoLite2-City.mmdb 数据库文件
            - ✅ 自动检测并使用 GeoIP 数据库（如存在）
            - ✅ 保留 Cloudflare 数据中心信息作为备选

            ## 使用方法
            1. 将 GeoLite2-City.mmdb 和 locations.json 放在程序同目录
            2. 运行程序即可自动识别 IP 地理位置
            3. 可通过 `-disable-geoip` 参数禁用 GeoIP

            ## 参数说明
            - `-geodb` : 指定 GeoIP 数据库路径（默认: GeoLite2-City.mmdb）
            - `-disable-geoip` : 禁用 GeoIP 数据库

            ## 注意事项
            - GeoLite2 数据库为免费版，数据可能存在一定偏差
            - 所有版本均静态编译，无需额外依赖

            完整变更日志:  
            https://github.com/Kwisma/iptest/commits/${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            ${{ github.workspace }}/release_assets/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.release_tag, '-rc') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
